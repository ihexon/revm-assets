name: build

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ALPINE_VERSION: 3.23.3
  LINUX_BUILDER_IMAGE: revm-assets-builder:ubuntu-25.10
  DROPBEAR_BUILDER_IMAGE: revm-assets-dropbear:alpine-3.23.3

jobs:
  build_alpine_rootfs_linux:
    name: build alpine rootfs (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Alpine Rootfs
        run: |
          ./build_alpine_rootfs_linux.sh

      - name: upload alpine-rootfs-Linux-${{ matrix.arch }}.tar.zst
        uses: actions/upload-artifact@v4
        with:
          name: alpine-rootfs-Linux-${{ matrix.arch }}.tar.zst
          path: alpine-rootfs-Linux-${{ matrix.arch }}.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_libkrun_darwin:
    name: build libkrun (Darwin arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
      - run: ./build_libepoxy_darwin.sh
      - run: ./build_virglrenderer_darwin.sh
      - run: ./build_libkrun_darwin.sh
      - name: Verify static libkrun bundle
        run: |
          tar --zstd -tf libkrun-Darwin-arm64.tar.zst | sort > contents.txt
          grep -Fx ./lib/libkrun.a contents.txt
          grep -Fx ./lib/libkrun.dylib contents.txt
          grep -Fx ./lib/libkrun.1.dylib contents.txt
          grep -Fx ./lib/libkrun.1.18.0.dylib contents.txt
          grep -Fx ./lib/libvirglrenderer.a contents.txt
          grep -Fx ./lib/libepoxy.a contents.txt
          grep -Fx ./lib/libMoltenVK.a contents.txt
          grep -Fx ./lib/libSPIRVCross.a contents.txt
          grep -Fx ./lib/libSPIRVTools.a contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: libkrun-Darwin-arm64.tar.zst
          path: libkrun-Darwin-arm64.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_libkrun_linux:
    name: build libkrun (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Ubuntu builder image
        run: docker build -t "$LINUX_BUILDER_IMAGE" .
      - run: |
          docker run --rm \
            --workdir "$GITHUB_WORKSPACE" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            "$LINUX_BUILDER_IMAGE" \
            ./build_libkrun_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libkrun-Linux-${{ matrix.arch }}.tar.zst
          path: libkrun-Linux-${{ matrix.arch }}.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_libkrunfw_linux:
    name: build libkrunfw (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Ubuntu builder image
        run: docker build -t "$LINUX_BUILDER_IMAGE" .
      - run: |
          docker run --rm \
            --workdir "$GITHUB_WORKSPACE" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            "$LINUX_BUILDER_IMAGE" \
            ./build_libkrunfw_linux.sh

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'aarch64'
        with:
          name: libkrunfw-src-Linux-aarch64.tar.zst
          path: libkrunfw-src-Linux-aarch64.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

      - uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-Linux-${{ matrix.arch }}.tar.zst
          path: libkrunfw-Linux-${{ matrix.arch }}.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_libkrunfw_darwin:
    name: build libkrunfw (Darwin arm64)
    needs: build_libkrunfw_linux
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libkrunfw-src-Linux-aarch64.tar.zst

      - run: ./build_libkrunfw_darwin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-Darwin-arm64.tar.zst
          path: libkrunfw-Darwin-arm64.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_busybox_linux:
    name: build busybox (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Ubuntu builder image
        run: docker build -t "$LINUX_BUILDER_IMAGE" .
      - run: |
          docker run --rm \
            --workdir "$GITHUB_WORKSPACE" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            "$LINUX_BUILDER_IMAGE" \
            ./build_busybox_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: busybox-Linux-${{ matrix.arch }}.tar.zst
          path: busybox-Linux-${{ matrix.arch }}.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_dropbear_linux:
    name: build dropbear (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Dropbear builder image
        run: docker build -f Dockerfile.dropbear -t "$DROPBEAR_BUILDER_IMAGE" .
      - run: |
          docker run --rm \
            --workdir "$GITHUB_WORKSPACE" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            "$DROPBEAR_BUILDER_IMAGE" \
            ./build_dropbear_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dropbear-Linux-${{ matrix.arch }}.tar.zst
          path: dropbear-Linux-${{ matrix.arch }}.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

  release:
    name: release
    if: github.ref_type == 'tag'
    needs:
      - build_alpine_rootfs_linux
      - build_busybox_linux
      - build_dropbear_linux
      - build_libkrun_darwin
      - build_libkrun_linux
      - build_libkrunfw_darwin
      - build_libkrunfw_linux
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          rm -f artifacts/libkrunfw-src-Linux-aarch64.tar.zst
          ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.zst
          generate_release_notes: true
          make_latest: true
